name: Build MoleGraph App (Android Test)

on:
  push:
    tags:
      - 'v*' # Spustí kompilaci POUZE tehdy, když se vytvoří tag začínající na "v"
  workflow_dispatch: # Ponechá možnost spouštět to ručně tlačítkem z webu

jobs:
  build-android:
    name: Kompilace pro Android (Qt 5.15)
    runs-on: ubuntu-22.04

    steps:
      - name: Stáhni zdrojové kódy
        uses: actions/checkout@v4

      - name: Nastavení Java JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Příprava Android prostředí (NDK r21 a oprava SDK)
        run: |
          # Potvrdí licence
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Stáhne NDK r21 a plně kompatibilní Android SDK 33
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" "platforms;android-33" "build-tools;33.0.2"
          
          # ULTIMÁTNÍ ČISTKA: Schováme si android-33 do bezpečí
          mv $ANDROID_HOME/platforms/android-33 $HOME/android-33-safe
          
          # Smažeme ÚPLNĚ VŠECHNY verze Androidu, co tam GitHub má (34, 35, 36, 37...)
          rm -rf $ANDROID_HOME/platforms/android-*
          
          # Vrátíme naši jedinou bezpečnou verzi zpět
          mv $HOME/android-33-safe $ANDROID_HOME/platforms/android-33
          
          # Nastaví systémové proměnné
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Instalace Qt 5.15.2 pro Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          target: 'android'

      - name: Vytvoř Build složku
        run: mkdir build
        working-directory: ./SerialToGraph

      - name: Qmake konfigurace
        run: qmake ../SerialToGraph.pro CONFIG+=release "ANDROID_ABIS=armeabi-v7a arm64-v8a x86 x86_64"
        working-directory: ./SerialToGraph/build

      - name: Kompilace C++ kódu (make)
        run: |
          make -j$(nproc)
          make install INSTALL_ROOT=android-build
        working-directory: ./SerialToGraph/build

      - name: Sestavení APK (androiddeployqt)
        run: |
          # Spustí balení s opraveným prostředím
          androiddeployqt --input android-MoleGraph-deployment-settings.json --output android-build --gradle
        working-directory: ./SerialToGraph/build

      - name: Příprava APK k odeslání
        run: |
          mkdir -p apk_output
          # Najde jakékoliv vytvořené APK (ať už debug nebo release) a zkopíruje ho s čistým názvem
          find SerialToGraph/build/android-build -name "*.apk" -exec cp {} apk_output/MoleGraph.apk \;

      - name: Ulož výsledek jako Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: MoleGraph-Android-APK
          # Odkazujeme už jen na tento jeden konkrétní soubor, takže ve stáhnutém ZIPu nebude žádná změť složek
          path: apk_output/MoleGraph.apk
