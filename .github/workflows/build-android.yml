name: Build MoleGraph App (Android Test)

on:
  push:
    tags:
      - 'v*' # Spustí kompilaci POUZE tehdy, když se vytvoří tag začínající na "v"
  workflow_dispatch: # Ponechá možnost spouštět to ručně tlačítkem z webu

jobs:
  build-android:
    name: Kompilace pro Android (Qt 5.15)
    runs-on: ubuntu-22.04

    steps:
      - name: Stáhnutí kódu (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Stáhne i historii a tagy pro git describe

      - name: Nastavení Java JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Příprava Android prostředí (NDK r21 a oprava SDK)
        run: |
          # Potvrdí licence
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Stáhne NDK r21 a plně kompatibilní Android SDK 33
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" "platforms;android-33" "build-tools;33.0.2"
          
          # ULTIMÁTNÍ ČISTKA: Schováme si android-33 do bezpečí
          mv $ANDROID_HOME/platforms/android-33 $HOME/android-33-safe
          
          # Smažeme ÚPLNĚ VŠECHNY verze Androidu, co tam GitHub má (34, 35, 36, 37...)
          rm -rf $ANDROID_HOME/platforms/android-*
          
          # Vrátíme naši jedinou bezpečnou verzi zpět
          mv $HOME/android-33-safe $ANDROID_HOME/platforms/android-33
          
          # Nastaví systémové proměnné
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Instalace Qt 5.15.2 pro Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          target: 'android'

      - name: Vytvoř Build složku
        run: mkdir build
        working-directory: ./SerialToGraph
      
      - name: Generování verze (GitVersion.h)
        run: |
          # Použijeme stejný příkaz jako púvodní Windows skript
          VERSION=$(git describe --always --tags --dirty)
          
          # Zapíšeme to do souboru
          echo "#ifndef VERSION_H" > GitVersion.h
          echo "#define VERSION_H" >> GitVersion.h
          echo "#define GIT_VERSION \"$VERSION\"" >> GitVersion.h
          echo "#endif //VERSION_H" >> GitVersion.h
        working-directory: ./SerialToGraph

      - name: Qmake konfigurace
        # Čte ABIS přímo z opraveného .pro souboru
        run: qmake ../SerialToGraph.pro CONFIG+=release
        working-directory: ./SerialToGraph/build

      - name: Kompilace C++ kódu (make)
        run: |
          make -j$(nproc)
          make install INSTALL_ROOT=android-build
          
          # Přibalíme složku sensors pro Android
          mkdir -p android-build/assets
          cp -r ../sensors android-build/assets/
        working-directory: ./SerialToGraph/build

      - name: Zabalení do APK (androiddeployqt)
        run: androiddeployqt --input android-libMoleGraph.so-deployment-settings.json --output android-build --android-platform android-34 --jdk /usr/lib/jvm/java-17-openjdk-amd64 --gradle
        working-directory: ./SerialToGraph/build

      - name: Příprava APK k podepsání
        run: |
          mkdir -p apk_output
          # Najde vytvořené APK a vykopíruje ho s názvem "unsigned"
          find SerialToGraph/build/android-build -name "*.apk" -exec cp {} apk_output/MoleGraph-unsigned.apk \;

      - name: Podepsání APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: apk_output
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Přejmenování finálního APK
        run: |
          # Vezme podepsaný soubor a přejmenuje ho načisto pro uživatele
          mv ${{steps.sign_app.outputs.signedReleaseFile}} apk_output/MoleGraph.apk

      - name: Ulož výsledek jako Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: MoleGraph-Android-APK
          path: apk_output/MoleGraph.apk
