name: Build MoleGraph App (Windows Test)

# Kdy se má akce spustit:
on:
  push:
    tags:
      - 'v*' # Spustí kompilaci POUZE tehdy, když se vytvoří tag začínající na "v"
  workflow_dispatch: # Ponechá možnost spouštět to ručně tlačítkem z webu

jobs:
  build-windows:
    name: Kompilace pro Windows (Qt 5.15)
    runs-on: windows-latest

    steps:
      - name: Checkout kód
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # <--- TOHLE POTŘEBUJEME PRO SKRIPT

      - name: Instalace Qt 5.15.2 (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81' # Použijeme MinGW kompilátor

      - name: Vytvoř Build složku
        run: mkdir build
        working-directory: ./SerialToGraph

      - name: Qmake konfigurace
        run: qmake ../SerialToGraph.pro CONFIG+=release
        working-directory: ./SerialToGraph/build

      - name: Kompilace (mingw32-make)
        run: mingw32-make
        working-directory: ./SerialToGraph/build

      - name: Příprava čistého balíčku (windeployqt)
        run: |
          # Vytvoří čistou složku pro distribuci, aby se nepletl balast z kompilace
          mkdir deploy
          
          # Najde váš hotový MoleGraph.exe a přesune ho do složky deploy
          Get-ChildItem -Path . -Filter "MoleGraph.exe" -Recurse | Copy-Item -Destination deploy\
          
          # Nakopíruje celou složku sensors k .exe
          Copy-Item -Path "..\sensors" -Destination "deploy\sensors" -Recurse
          
      - name: Přibalení Qt knihoven a promazání balastu
        run: |
          # 1. Necháme Qt přibalit všechno, co považuje za nutné
          windeployqt release/MoleGraph.exe
          
          # 2. Hrubou silou vymažeme 38MB nepotřebný balast
          Remove-Item -Path "release\translations" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "release\D3Dcompiler_47.dll" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "release\libGLESv2.dll" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "release\opengl32sw.dll" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "release\libEGL.dll" -Force -ErrorAction SilentlyContinue
        working-directory: ./SerialToGraph/build
      
      - name: Příprava doplňkových souborů
        run: |
          # Zkopíruje licenci z hlavního adresáře projektu k hotovému EXE souboru
          cp ../LICENSE.txt release/
        working-directory: ./SerialToGraph/build

      - name: Kompilace Inno Setup Instalátoru
        # Přepneme se do složky se zdrojovým kódem (tam, kde je náš installer.iss)
        working-directory: ./SerialToGraph
        run: |
          # Vytvoříme zástupce na deploy složku k našemu ISS souboru
          Copy-Item -Path "build\deploy" -Destination "deploy" -Recurse
          
          # Spustíme kompilátor Inno Setupu (na GitHub Windows serverech je už předinstalovaný!)
          iscc installer.iss        

      - name: Ulož výsledek jako Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: MoleGraph-Windows
          path: SerialToGraph/deploy/MoleGraph-Installer.exe
