name: Build MoleGraph App (Windows Test)

# Kdy se má akce spustit:
on:
  push:
    paths:
      - 'SerialToGraph/**' # Spustí se při úpravě kódu aplikace
  workflow_dispatch:       # Přidá tlačítko pro ruční spuštění (geniální pro testování!)

jobs:
  build-windows:
    name: Kompilace pro Windows (Qt 5.15)
    runs-on: windows-latest

    steps:
      - name: Stáhni zdrojové kódy
        uses: actions/checkout@v4

      - name: Instalace Qt 5.15.2 (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81' # Použijeme MinGW kompilátor

      - name: Vytvoř Build složku
        run: mkdir build
        working-directory: ./SerialToGraph

      - name: Qmake konfigurace
        run: qmake ../SerialToGraph.pro CONFIG+=release
        working-directory: ./SerialToGraph/build

      - name: Kompilace (mingw32-make)
        run: mingw32-make
        working-directory: ./SerialToGraph/build

      - name: Příprava čistého balíčku (windeployqt)
        run: |
          # Vytvoří čistou složku pro distribuci, aby se nepletl balast z kompilace
          mkdir deploy
          
          # Najde váš hotový MoleGraph.exe a přesune ho do složky deploy
          Get-ChildItem -Path . -Filter "MoleGraph.exe" -Recurse | Copy-Item -Destination deploy\
          
          # Nakopíruje celou složku sensors k .exe
          Copy-Item -Path "..\sensors" -Destination "deploy\sensors" -Recurse
          
          # Doplní všechny potřebné Qt knihovny a DLL přímo k .exe souboru
          windeployqt deploy\MoleGraph.exe
        working-directory: ./SerialToGraph/build

      - name: Kompilace Inno Setup Instalátoru
        # Přepneme se do složky se zdrojovým kódem (tam, kde je náš installer.iss)
        working-directory: ./SerialToGraph
        run: |
          # Vytvoříme zástupce na deploy složku k našemu ISS souboru
          Copy-Item -Path "build\deploy" -Destination "deploy" -Recurse
          
          # Spustíme kompilátor Inno Setupu (na GitHub Windows serverech je už předinstalovaný!)
          iscc installer.iss        

      - name: Ulož výsledek jako Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: MoleGraph-Windows
          path: SerialToGraph/deploy/MoleGraph-Installer.exe
