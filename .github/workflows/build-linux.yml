name: Build MoleGraph App (Linux Test)

on:
  push:
    tags:
      - 'v*' # Spustí kompilaci POUZE tehdy, když se vytvoří tag začínající na "v"
  workflow_dispatch: # Ponechá možnost spouštět to ručně tlačítkem z webu

jobs:
  build-linux:
    name: Kompilace pro Linux (Qt 5.15)
    # Zůstáváme na moderním systému, který funguje!
    runs-on: ubuntu-22.04

    steps:
      - name: Stáhni zdrojové kódy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Nutná historie pro vyčtení verze z tagů Gitu!

      - name: Instalace základních Linux nástrojů
        run: sudo apt-get update && sudo apt-get install -y build-essential libgl1-mesa-dev patchelf libfuse2

      - name: Instalace Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'desktop'

      - name: Vytvoř Build složku
        run: mkdir build
        working-directory: ./SerialToGraph

      - name: Generování GitVersion.h pro Linux
        working-directory: ./SerialToGraph
        run: |
          # Vyčteme tag z Gitu přímo v Linuxu
          VERSION_TAG=$(git describe --tags --always)
          
          # Vygenerujeme nový GitVersion.h (ve win to dělal .bat)
          cat <<EOF > GitVersion.h
          #ifndef VERSION_H 
          #define VERSION_H  
          #define GIT_VERSION "$VERSION_TAG" 
          #endif //VERSION_H
          EOF
          
      - name: Qmake konfigurace
        run: qmake ../SerialToGraph.pro CONFIG+=release
        working-directory: ./SerialToGraph/build

      - name: Kompilace (make)
        run: make -j$(nproc)
        working-directory: ./SerialToGraph/build

      - name: Příprava struktury pro balení
        run: |
          mkdir -p AppDir/usr/bin
          
          # Nakopíruje binárku a složku sensors
          cp build/MoleGraph AppDir/usr/bin/
          cp -r sensors AppDir/usr/bin/
          
          # Vytvoříme .desktop s komentářem přímo v SerialToGraph (ne uvnitř AppDir)
          cat <<EOF > MoleGraph.desktop
          [Desktop Entry]
          Type=Application
          Name=MoleGraph
          Exec=MoleGraph
          Comment=MoleGraph is a multi-platform application used to record and visualize data from the Arduino based school probeware MoleGraph system
          Icon=MoleGraph
          Categories=Education;Science;
          Terminal=false
          EOF
        working-directory: ./SerialToGraph

      - name: Vytvoření AppImage (linuxdeploy)
        run: |
          # 1. Stáhneme hlavní moderní nástroj linuxdeploy
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod a+x linuxdeploy-x86_64.AppImage
          
          # 2. Stáhneme oficiální Qt plugin pro tento nástroj
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod a+x linuxdeploy-plugin-qt-x86_64.AppImage
          
          # 3. Získáme verzi z Gitu (aby aplikace uvnitř věděla, jaká je verze)
          export VERSION=$(git describe --tags --always | sed 's/^v//')
          
          # 4. Spustíme balení
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -d MoleGraph.desktop -i MoleGraph.svg --plugin qt --output appimage
          
          # 5. Přejmenujeme ten ošklivý technický název na čistý "MoleGraph.AppImage"
          mv MoleGraph*.AppImage MoleGraph.AppImage
        working-directory: ./SerialToGraph
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake

      - name: Ulož výsledek jako Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: MoleGraph-Linux
          # Tady už hledáme jen náš hezky přejmenovaný soubor
          path: SerialToGraph/MoleGraph.AppImage
