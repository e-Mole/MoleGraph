name: Test MoleGraph macOS & Screenshot

on:
  workflow_dispatch:

jobs:
  test-molegraph:
    runs-on: macos-latest

    steps:
      - name: Download artifact from specific run
        uses: dawidd6/action-download-artifact@v3
        with:
          run_id: 37696392679
          name: MoleGraph-macOS
          path: ./artifact
          # Akce to sama rozbalí, v ./artifact bude rovnou MoleGraph.dmg

      # Krok "Unzip ZIP archive" jsme smazali, už není potřeba

      - name: Mount DMG, run app and take screenshot
        run: |
          cd ./artifact
          
          # Pro jistotu vypíšeme obsah, abychom viděli DMG
          echo "=== Obsah složky artifact po stažení ==="
          ls -la
          
          mkdir -p mnt
          
      - name: Mount DMG, run app and catch logs
        run: |
          cd ./artifact
          mkdir -p mnt
          hdiutil attach MoleGraph.dmg -mountpoint mnt -nobrowse
          
          APP_PATH="mnt/MoleGraph.app"
          
          if [ -d "$APP_PATH" ]; then
            echo "Aplikace nalezena, kopíruji do /tmp..."
            cp -R "$APP_PATH" /tmp/
            sudo xattr -rd com.apple.quarantine /tmp/MoleGraph.app || true
            
            # Zjištění názvu spustitelného souboru uvnitř aplikace
            EXECUTABLE=$(defaults read "/tmp/MoleGraph.app/Contents/Info" CFBundleExecutable)
            echo "Spouštím binárku napřímo: $EXECUTABLE"
            
            # Spuštění binárky napřímo, timeout ukončí proces po 15 vteřinách
            timeout 15s "/tmp/MoleGraph.app/Contents/MacOS/$EXECUTABLE" || echo "Aplikace doběhla nebo vypršel časový limit."
            
          else
            echo "Chyba: MoleGraph.app nebyl v DMG nalezen!"
            exit 1
          fi
          
          # Úklid
          hdiutil detach mnt -force

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot
          path: app_screenshot.png
          retention-days: 1
