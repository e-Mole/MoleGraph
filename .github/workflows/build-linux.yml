name: Build MoleGraph App (Linux Test)

on:
  push:
    paths:
      - 'SerialToGraph/**'
  workflow_dispatch:

jobs:
  build-linux:
    name: Kompilace pro Linux (Qt 5.15)
    # Zůstáváme na moderním systému, který funguje!
    runs-on: ubuntu-22.04

    steps:
      - name: Stáhni zdrojové kódy
        uses: actions/checkout@v4

      - name: Instalace základních Linux nástrojů
        run: sudo apt-get update && sudo apt-get install -y build-essential libgl1-mesa-dev patchelf libfuse2

      - name: Instalace Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'desktop'

      - name: Vytvoř Build složku
        run: mkdir build
        working-directory: ./SerialToGraph

      - name: Qmake konfigurace
        run: qmake ../SerialToGraph.pro CONFIG+=release
        working-directory: ./SerialToGraph/build

      - name: Kompilace (make)
        run: make -j$(nproc)
        working-directory: ./SerialToGraph/build

      - name: Příprava struktury pro balení
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          
          cp build/MoleGraph AppDir/usr/bin/

          # Nakopíruje složku sensors vedle binárky
          cp -r sensors AppDir/usr/bin/
          
          cat <<EOF > AppDir/usr/share/applications/MoleGraph.desktop
          [Desktop Entry]
          Type=Application
          Name=MoleGraph
          Exec=MoleGraph
          Icon=MoleGraph
          Categories=Education;Science;
          Terminal=false
          EOF
          
          cp MoleGraph.svg AppDir/usr/share/icons/hicolor/scalable/apps/MoleGraph.svg
        working-directory: ./SerialToGraph

      - name: Vytvoření moderního AppImage (linuxdeploy)
        run: |
          # 1. Stáhneme hlavní moderní nástroj linuxdeploy
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod a+x linuxdeploy-x86_64.AppImage
          
          # 2. Stáhneme oficiální Qt plugin pro tento nástroj
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod a+x linuxdeploy-plugin-qt-x86_64.AppImage
          
          export VERSION=4.4.2
          
          # 3. Spustíme balení. Nástroj automaticky zavolá Qt plugin, 
          # sesbírá knihovny a vyrobí finální AppImage, aniž by se ptal na věk sytému!
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
        working-directory: ./SerialToGraph
        env:
          # Tento plugin potřebuje vědět, kde je Qmake, aby našel knihovny
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake

      - name: Ulož výsledek jako Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: MoleGraph-Linux
          path: SerialToGraph/MoleGraph*.AppImage
